<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="50%" stop-color="#201535"/>
      <stop offset="100%" stop-color="#2D1A45"/>
    </linearGradient>
    <pattern id="grid5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A855F7" stroke-width="0.75" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad5)"/>
  <rect width="800" height="500" fill="url(#grid5)"/>
  <circle cx="400" cy="220" r="140" fill="#A855F7" opacity="0.12" filter="blur(40px)"/>
  
  <!-- Illustration: Events & Felicitations / Trophy & Stage -->
  <g transform="translate(400, 200)">
    <!-- Stage Base -->
    <rect x="-85" y="45" width="170" height="15" rx="5" fill="#3B0764" stroke="#C084FC" stroke-width="1.5"/>
    <!-- Trophy Cup -->
    <path d="M -30 -45 L 30 -45 L 24 0 C 18 20 -18 20 -24 0 Z" fill="#1E1B4B" stroke="#E9D5FF" stroke-width="2"/>
    <!-- Handles -->
    <path d="M -30 -35 C -50 -35 -50 -10 -25 -5" fill="none" stroke="#C084FC" stroke-width="2"/>
    <path d="M 30 -35 C 50 -35 50 -10 25 -5" fill="none" stroke="#C084FC" stroke-width="2"/>
    <!-- Stem & Base -->
    <path d="M -8 18 L 8 18 L 12 40 L -12 40 Z" fill="#C084FC"/>
    <!-- Sparkles / Star -->
    <polygon points="0,-70 5,-58 17,-58 8,-50 11,-38 0,-45 -11,-38 -8,-50 -17,-58 -5,-58" fill="#FDE047"/>
  </g>
  
  <!-- Category Badge -->
  <rect x="285" y="330" width="230" height="28" rx="14" fill="#581C87" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">EVENTS &amp; FELICITATIONS</text>
  
  <!-- Main Title -->
  <text x="400" y="395" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Scholar Felicitations &amp; Parent Meets</text>
  
  <!-- Subtitle -->
  <text x="400" y="425" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">United Classes Bhandara • Academic Events</text>
</svg>
