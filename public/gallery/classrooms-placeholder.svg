<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="50%" stop-color="#101D38"/>
      <stop offset="100%" stop-color="#162746"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Subtle ambient glow circle -->
  <circle cx="400" cy="220" r="140" fill="#2563EB" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Category Illustration: Classroom / Smart Board Setup -->
  <g transform="translate(400, 200)">
    <!-- Board Base -->
    <rect x="-110" y="-75" width="220" height="130" rx="12" fill="#1E293B" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Screen content lines -->
    <rect x="-90" y="-55" width="80" height="8" rx="4" fill="#38BDF8" opacity="0.8"/>
    <rect x="-90" y="-35" width="130" height="6" rx="3" fill="#94A3B8" opacity="0.5"/>
    <rect x="-90" y="-20" width="100" height="6" rx="3" fill="#94A3B8" opacity="0.4"/>
    <!-- Atom / Science icon on board -->
    <ellipse cx="50" cy="-20" rx="30" ry="12" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.8" transform="rotate(30 50 -20)"/>
    <ellipse cx="50" cy="-20" rx="30" ry="12" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.8" transform="rotate(-30 50 -20)"/>
    <circle cx="50" cy="-20" r="4" fill="#38BDF8"/>
    <!-- Stand -->
    <path d="M -40 55 L -60 95 M 40 55 L 60 95" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <path d="M -70 95 L 70 95" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Category Badge -->
  <rect x="300" y="330" width="200" height="28" rx="14" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CLASSROOM ENVIRONMENT</text>
  
  <!-- Main Title -->
  <text x="400" y="395" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Modern Lecture Hall &amp; Visual Tech</text>
  
  <!-- Subtitle -->
  <text x="400" y="425" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">United Classes Bhandara • Infrastructure Facility</text>
</svg>
