<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="50%" stop-color="#162235"/>
      <stop offset="100%" stop-color="#1F2A38"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  <rect width="800" height="500" fill="url(#grid3)"/>
  <circle cx="400" cy="220" r="140" fill="#D97706" opacity="0.12" filter="blur(40px)"/>
  
  <!-- Illustration: Academic Activities / OMR & Test Session -->
  <g transform="translate(400, 200)">
    <!-- OMR Sheet / Exam Clipboard -->
    <rect x="-65" y="-80" width="130" height="160" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="-40" y="-90" width="80" height="18" rx="4" fill="#334155" stroke="#F59E0B" stroke-width="1"/>
    <!-- Question row bubbles -->
    <g transform="translate(-45, -50)">
      <circle cx="10" cy="0" r="6" fill="#F59E0B"/>
      <circle cx="30" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="50" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="70" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </g>
    <g transform="translate(-45, -25)">
      <circle cx="10" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="30" cy="0" r="6" fill="#F59E0B"/>
      <circle cx="50" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="70" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </g>
    <g transform="translate(-45, 0)">
      <circle cx="10" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="30" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="50" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="70" cy="0" r="6" fill="#F59E0B"/>
    </g>
    <g transform="translate(-45, 25)">
      <circle cx="10" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="30" cy="0" r="6" fill="#F59E0B"/>
      <circle cx="50" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
      <circle cx="70" cy="0" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </g>
    <!-- Stopwatch / Timer icon on right -->
    <circle cx="75" cy="40" r="26" fill="#0B1528" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 75 25 L 75 40 L 86 40" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Category Badge -->
  <rect x="295" y="330" width="210" height="28" rx="14" fill="#78350F" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ACADEMIC ACTIVITIES</text>
  
  <!-- Main Title -->
  <text x="400" y="395" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Timed Assessments &amp; Problem Drills</text>
  
  <!-- Subtitle -->
  <text x="400" y="425" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">United Classes Bhandara • Examination Activity</text>
</svg>
