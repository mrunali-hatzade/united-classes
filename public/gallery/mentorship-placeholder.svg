<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="50%" stop-color="#12183A"/>
      <stop offset="100%" stop-color="#1E1E4F"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#818CF8" stroke-width="0.75" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  <rect width="800" height="500" fill="url(#grid2)"/>
  <circle cx="400" cy="220" r="140" fill="#6366F1" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Illustration: Faculty & Mentorship / Discussion -->
  <g transform="translate(400, 200)">
    <!-- Desk Base -->
    <rect x="-90" y="25" width="180" height="12" rx="4" fill="#334155" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M -70 37 L -70 85 M 70 37 L 70 85" stroke="#475569" stroke-width="3"/>
    <!-- Mentor figure (Left) -->
    <circle cx="-45" cy="-35" r="22" fill="#4338CA" stroke="#818CF8" stroke-width="2"/>
    <path d="M -75 25 C -75 -10 -15 -10 -15 25 Z" fill="#312E81" stroke="#6366F1" stroke-width="1.5"/>
    <!-- Student figure (Right) -->
    <circle cx="45" cy="-28" r="18" fill="#1E293B" stroke="#A5B4FC" stroke-width="1.5"/>
    <path d="M 20 25 C 20 -5 70 -5 70 25 Z" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <!-- Discussion bubble / Sparkle -->
    <circle cx="0" cy="-45" r="14" fill="#101D38" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M -5 -45 L 5 -45 M 0 -50 L 0 -40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Category Badge -->
  <rect x="290" y="330" width="220" height="28" rx="14" fill="#312E81" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#C7D2FE" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FACULTY &amp; MENTORSHIP</text>
  
  <!-- Main Title -->
  <text x="400" y="395" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">Doubt Resolution &amp; Academic Desk</text>
  
  <!-- Subtitle -->
  <text x="400" y="425" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">United Classes Bhandara • Mentorship Facility</text>
</svg>
